name: CI - Lint & Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "22"
          cache: true
          run-install: true

      - name: Type check
        run: npx nuxi typecheck
        continue-on-error: true

      - name: Build check
        run: npx nuxi generate
