name: CI - Lint & Type Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Lint
        run: vp lint

      - name: Format check
        run: vp fmt --check

      - name: Type check
        run: vp exec nuxi typecheck
        continue-on-error: true

      - name: Build check
        run: vp exec nuxi generate
